<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nani Studio | Digital Tools</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f1e8;
      color: #3b2418;
      line-height: 1.6;
    }

    header {
      background: #fffaf3;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dfd0bf;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: #3b2418;
      text-decoration: none;
      margin-left: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    nav a:hover {
      color: #8a5a3b;
    }

    .hero {
      min-height: 520px;
      padding: 90px 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
      background:
        radial-gradient(circle at 80% 30%, #d9b899 0%, transparent 30%),
        linear-gradient(135deg, #f8f0e5, #ead8c5);
    }

    .hero-text {
      max-width: 560px;
    }

    .small-title {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 18px;
      color: #805537;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      font-style: italic;
      font-weight: normal;
    }

    .hero p {
      font-family: Arial, sans-serif;
      max-width: 460px;
      color: #604636;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #4b2c1e;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .button:hover {
      background: #70452f;
    }

    .coffee-card {
      width: 330px;
      height: 330px;
      background: #4b2c1e;
      border-radius: 50% 50% 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 20px 25px 50px rgba(70, 40, 20, 0.2);
    }

    .coffee {
      width: 180px;
      height: 180px;
      background: #f4dfc5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      box-shadow: inset 0 0 0 15px #fff8ee;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #d8c6b2;
    }

    .feature {
      background: #fffaf3;
      padding: 35px 20px;
      text-align: center;
    }

    .feature-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .feature h3 {
      margin-bottom: 6px;
    }

    .feature p {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #705748;
    }

    .shop {
      padding: 80px 7%;
      text-align: center;
    }

    .section-title {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .section-subtitle {
      font-family: Arial, sans-serif;
      color: #765c4d;
      margin-bottom: 45px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      text-align: left;
    }

    .product {
      background: #fffaf3;
      border: 1px solid #e2d5c6;
      padding: 15px;
      transition: transform 0.2s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product-image {
      height: 220px;
      background: linear-gradient(145deg, #c9a98c, #65402c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      font-size: 24px;
      padding: 20px;
    }

    .product h3 {
      margin-top: 15px;
    }

    .price {
      font-family: Arial, sans-serif;
      font-weight: bold;
      margin: 5px 0 15px;
    }

    .product .button {
      width: 100%;
      text-align: center;
      padding: 11px;
    }

    .about {
      padding: 80px 10%;
      background: #e9d7c3;
      text-align: center;
    }

    .about p {
      max-width: 650px;
      margin: 20px auto 30px;
      font-family: Arial, sans-serif;
      color: #5f4738;
    }

    footer {
      background: #3b2418;
      color: #fff8ee;
      padding: 45px 7%;
      text-align: center;
    }

    footer p {
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-top: 8px;
      opacity: 0.8;
    }

    @media (max-width: 800px) {
      header {
        padding: 15px 5%;
      }

      nav a {
        margin-left: 8px;
        font-size: 12px;
      }

      .hero {
        flex-direction: column;
        text-align: center;
        padding: 70px 6%;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .coffee-card {
        width: 250px;
        height: 250px;
      }

      .coffee {
        width: 140px;
        height: 140px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 500px) {
      .products {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 32px;
      }
    }
